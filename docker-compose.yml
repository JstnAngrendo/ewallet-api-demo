version: '3.8'

services:
  # Database dan Redis tetap sama
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: ewallet_db # Ini bisa kita biarkan, tidak mengganggu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - mynetwork

  redis:
    image: redis:6-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    networks:
      - mynetwork

  # --- TAMBAHKAN ZOOKEEPER ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - mynetwork

  # --- TAMBAHKAN KAFKA ---
  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - mynetwork

  # Hapus 'app' yang lama, dan definisikan service kita satu per satu
  # --- SERVICE OTENTIKASI ---
  auth-service:
    build:
      context: ./services/auth-service # Arahkan ke Dockerfile di dalam auth-service
      dockerfile: Dockerfile
    container_name: auth_service_app
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ewallet_auth_dev_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - db
      - kafka
    ports:
      - "8081:8081" # Port yang sudah kita set di application.properties
    networks:
      - mynetwork

  # --- SERVICE DOMPET ---
  wallet-service:
    build:
      context: ./services/wallet-service # Arahkan ke Dockerfile di dalam wallet-service
      dockerfile: Dockerfile
    container_name: wallet_service_app
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ewallet_wallet_dev_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - db
      - kafka
    ports:
      - "8082:8082" # Port yang sudah kita set di application.properties
    networks:
      - mynetwork

networks:
  mynetwork: