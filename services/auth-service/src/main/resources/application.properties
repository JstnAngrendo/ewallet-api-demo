spring.application.name=auth-service
# Konfigurasi Koneksi Database untuk Auth Service
spring.datasource.url=jdbc:postgresql://localhost:5432/ewallet_auth_dev_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Konfigurasi Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Konfigurasi Port Aplikasi
# Kita akan menjalankan Auth Service di port yang berbeda dari service lain
server.port=8081

